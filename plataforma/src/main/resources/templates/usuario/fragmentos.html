<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos :: head}">
            <title>Usuarios</title>
    </head>
    <body>
        <!-- fragmento 1 para Agregar usuario en ventana modal -->
        <section th:fragment="agregar">
            <!-- Button trigger modal -->
            <div class='row py-4 mb-2 bg-light'>
                <div class='col-md-1'></div>
                <div class='col-md-3'>
                    <button type="button" class="btn btn-primary"  sec:authorize="hasRole('ADMIN')"
                            data-bs-toggle="modal" data-bs-target="#agregarUsuarioModal">
                        <i class="fa-solid fa-plus"></i> Agregar usuario</button>
                </div>
            </div>
            <!-- Modal -->
            <div class="modal fade" id="agregarUsuarioModal"  tabindex="-1"
                 aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header bg-info text-white">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">
                                <i class="fa-solid fa-layer-group"></i> Agregar usuario</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <form th:action='@{/usuario/guardar}' th:object='${usuario}'
                              class='was-validated' enctype="multipart/form-data" method="post">
                            <div class="modal-body">
                                <div class='mb-3'>
                                    <label>Nombre</label>
                                    <input type="text" name='nombre' class='form-control' maxlength="20" required/>
                                </div>
                                <div class='mb-3'>
                                    <label>Email</label>
                                    <input type="email" name='email' class='form-control' maxlength="75" required/>
                                </div>
                                <div class="mb-3">
                                    <label>Rol</label>
                                    <select name="rol" class="form-control" required>
                                        <option th:each="r : ${roles}"
                                                th:value="${r.id}"
                                                th:text="${r.nombre}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                    <i class="fa-solid fa-xmark"></i> Cerrar</button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- fragmento 2 para el listado de usuarios -->
        <section th:fragment="listado" class="p-3">
            <div class="row p-3">
                <div class="col-md-9">
                    <div class="card p-2">
                        <div class="card-header"><h4>Listado de Usuarios</h4></div>
                        <div class="card-body">
                            <div th:if="${usuarios != null and !usuarios.empty}">
                                <table class="table table-striped table-hover">
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Nombre</th>
                                        <th>Email</th>
                                        <th>Rol</th>
                                        <th sec:authorize="hasRole('ADMIN')"></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="u : ${usuarios}">
                                            <td>[[${u.id}]]</td>
                                            <td>[[${u.nombre}]]</td>
                                            <td>[[${u.email}]]</td>
                                            <td>[[${u.rol != null ? u.rol.nombre : 'Sin rol'}]]</td>

                                            <td sec:authorize="hasRole('ADMIN')">
                                                <!-- EDITAR -->
                                                <a th:href="@{/usuario/modificar/}+${u.id}"
                                                   class="btn btn-warning">
                                                    <i class="fas fa-pencil-alt"></i>
                                                </a>

                                                <!-- ELIMINAR (SIN MODAL) -->
                                                <form th:action="@{/usuario/eliminar}"
                                                      method="post"
                                                      style="display:inline;">
                                                    <input type="hidden"
                                                           name="id"
                                                           th:value="${u.id}"/>

                                                    <button type="submit"
                                                            class="btn btn-danger"
                                                            onclick="return confirm('¿Desea eliminar este usuario?')">
                                                        <i class="fa-solid fa-trash"></i>
                                                    </button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table></div>
                            <div class="text-center p-2" th:if="${usuarios == null or usuarios.empty}">
                                <span>No hay usuarios registrados</span></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center bg-success text-white mb-3">
                        <div class="card-body"><h3>Total Usuarios</h3>
                            <h4 class="fs-2"><i class="fas fa-layer-group"></i> [[${totalUsuarios}]]</h4>
                        </div></div>
                </div>
            </div>
        </section>

        <!-- 3 Fragmento que se utiliza en la página modifca.html -->
        <section th:fragment="editar">
            <div class="row">
                <div class="col-md-2"></div>
                <div class="col-md-8">
                    <form method="POST" th:action="@{/usuario/guardar}"
                          th:object="${usuario}" class="was-validated" enctype="multipart/form-data">
                        <input type="hidden" name="id" th:field="*{id}"/>
                        <div class="row py-4 mb-4 bg-light">
                            <div class="col-md-4 d-grid">
                                <a th:href="@{/usuario/listado}" class="btn btn-primary">
                                    <i class="fas fa-arrow-left"></i> Regresar</a>
                            </div>
                            <div class="col-md-4 d-grid">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-check"></i> Guardar</button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <div class="card">
                                    <div class="card-header"><h4>Actualizar Usuario</h4></div>
                                    <div class="card-body">
                                        <div class='mb-3'>
                                            <label>Nombre</label>
                                            <input type="text" name='nombre' th:field='*{nombre}' class='form-control' maxlength="20" required/>
                                            <div th:if="${#fields.hasErrors('nombre')}" class="text-danger">
                                                <p th:errors="*{nombre}"></p>
                                            </div>
                                        </div>
                                        <div class='mb-3'>
                                            <label>Email</label>
                                            <input type="email" name='email' th:field='*{email}' class='form-control' maxlength="75" required/>
                                            <div th:if="${#fields.hasErrors('email')}" class="text-danger">
                                                <p th:errors="*{email}"></p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </body>
</html>
