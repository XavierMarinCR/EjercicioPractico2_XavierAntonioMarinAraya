<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos :: head}" > 
        <title>Login</title>
    </head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        <div class="row my-5">
            <div class="col-md-4 offset-md-4">
                <div class="card">
                    <div class="card-header bg-success text-white text-center">
                        <h2>Iniciar Sesión</h2>
                    </div>
                    <div class="card-body">
                        <form method="POST" th:action="@{/login}">
                            <!-- Formulario y campos -->
                            <div class="row my-3">
                                <label for="username" class="col-md-1 my-auto"><i class="fas fa-user-lock"></i></label>
                                <div class="col-md-11 my-auto">
                                    <input class="form-control" id="username" type="text" name="username" placeholder="Usuario"/>
                                </div>
                            </div>
                            <div class="row my-3">
                                <label for="password" class="col-md-1 my-auto"><i class="fas fa-key"></i></label>
                                <div class="col-md-11 my-auto">
                                    <input class="form-control" id="password" type="password" name="password" placeholder="Password"/>
                                </div>
                            </div>                            
                            <!-- Botones y enlaces -->
                            <div class="d-flex justify-content-around mt-4">                              
                                <!-- Botón para enviar el formulario -->
                                <button class="btn btn-success" type="submit"><i class="fas fa-sign-in-alt"></i> Ingresar</button>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- Manejo de Errores -->
                <div th:if="${param.error != null}" class="alert alert-danger mt-3 text-center">
                    Usuario o contraseña incorrectos
                </div>
            </div>
        </div>
        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
