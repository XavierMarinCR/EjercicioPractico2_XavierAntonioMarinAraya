
#Nombre de la aplicación
spring.application.name=plataforma

#Puerto por donde escucha el servidor web
server.port=78

#Para definir el formato de despliegue de fecha/hora del log en la consola
logging.pattern.dateformat=hh:mm

#Para eliminar mensajes invasivos de Spring
spring.main.banner-mode=off

#En desarrollo el "cache" del servidor (false), en producción "true"
spring.thymeleaf.cache=false

# Conexión local a la BD Cursos en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/eventos

# Usuario y clave
spring.datasource.username=usuario_caso_practico_02
spring.datasource.password=12345

# Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#Propiedades para enviar correos...
spring.mail.host=smtp.gmail.com
spring.mail.port=587
